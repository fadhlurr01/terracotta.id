<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Terracotta Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2725B" />
      <stop offset="60%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#8B3A1C" />
    </linearGradient>

    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1B" />
      <stop offset="100%" stop-color="#141110" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Elegant Octagon / Circular Seal -->
  <circle cx="50" cy="50" r="47" fill="url(#darkBgGrad)" stroke="url(#goldGradient)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" stroke-dasharray="2, 2" opacity="0.7" />

  <!-- Botanical Laurels / Coffee Branch Accent (Left) -->
  <path d="M 24 54 C 23 44 30 33 40 28" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M 23 48 C 19 46 19 41 24 43" fill="url(#goldGradient)" opacity="0.9"/>
  <path d="M 27 38 C 23 35 25 30 30 34" fill="url(#goldGradient)" opacity="0.9"/>
  <path d="M 34 30 C 31 26 35 22 38 27" fill="url(#goldGradient)" opacity="0.9"/>

  <!-- Botanical Laurels / Coffee Branch Accent (Right) -->
  <path d="M 76 54 C 77 44 70 33 60 28" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  <path d="M 77 48 C 81 46 81 41 76 43" fill="url(#goldGradient)" opacity="0.9"/>
  <path d="M 73 38 C 77 35 75 30 70 34" fill="url(#goldGradient)" opacity="0.9"/>
  <path d="M 66 30 C 69 26 65 22 62 27" fill="url(#goldGradient)" opacity="0.9"/>

  <!-- Central Steam Whiffs (Subtle & Elegant S-Curves) -->
  <path d="M 45 31 C 43 27 47 24 45 20" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 50 30 C 48 25 52 22 50 17" fill="none" stroke="url(#goldGradient)" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M 55 31 C 53 27 57 24 55 20" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Artisanal Terracotta Cup Body -->
  <!-- Cup Base / Saucer -->
  <path d="M 33 65 C 33 67 67 67 67 65 C 64 64 36 64 33 65 Z" fill="url(#goldGradient)" />
  <line x1="28" y1="67" x2="72" y2="67" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cup Silhouette with Terracotta Gradient -->
  <path d="M 32 37 L 68 37 C 67 55 59 63 50 63 C 41 63 33 55 32 37 Z" 
        fill="url(#terracottaGrad)" 
        stroke="url(#goldGradient)" 
        stroke-width="1.2" />

  <!-- Cup Handle -->
  <path d="M 66 41 C 74 41 75 53 64 54" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Golden Emblem: Artisanal Coffee Bean in center of cup -->
  <g transform="translate(50, 49) scale(0.72) translate(-50, -50)">
    <!-- Bean Body Outer -->
    <path d="M 50 36 C 40 36 34 42 34 50 C 34 58 40 64 50 64 C 60 64 66 58 66 50 C 66 42 60 36 50 36 Z" 
          fill="#1C1613" 
          stroke="url(#goldGradient)" 
          stroke-width="1.4" />
    <!-- Bean Center S-curve Creep -->
    <path d="M 50 37 C 46 43 54 47 50 51 C 46 55 54 57 50 63" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="1.4" 
          stroke-linecap="round" />
  </g>

  <!-- Star Embellishments -->
  <polygon points="50,71 51.5,74.5 55,75 52.5,77.5 53,81 50,79 47,81 47.5,77.5 45,75 48.5,74.5" fill="url(#goldGradient)" />
  <circle cx="39" cy="76" r="1" fill="url(#goldGradient)" opacity="0.8" />
  <circle cx="61" cy="76" r="1" fill="url(#goldGradient)" opacity="0.8" />

  <!-- EST. 2024 Subtle Ribbon Arch / Lettering -->
  <text x="50" y="87" font-family="'Cinzel', 'Playfair Display', serif" font-size="5" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="1.8">ROASTERY</text>
</svg>
